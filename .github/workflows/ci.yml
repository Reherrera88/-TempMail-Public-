name: CI/CD TempMail

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run basic syntax check
        run: |
          python -m py_compile app.py

      - name: Validate Dockerfile
        run: |
          docker build --no-cache -t tempmail-api-test .

      - name: Test API health endpoint
        run: |
          docker run -d --name tempmail-test -p 5000:5000 \
            -e IMAP_HOST=10.0.0.1 \
            -e IMAP_PORT=993 \
            -e CSV_PATH=/app/cuentas_kards.csv \
            tempmail-api-test
          sleep 10
          curl -f http://localhost:5000/health || (docker logs tempmail-test && exit 1)
          docker stop tempmail-test

  deploy-docs:
    needs: lint-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README
        run: |
          # Basic markdown validation
          if [ -f README.md ]; then
            echo "README.md exists ✓"
          else
            echo "README.md missing ✗"
            exit 1
          fi

      - name: Check required files
        run: |
          required_files=(
            "app.py"
            "Dockerfile"
            "docker-compose-local.yml"
            "requirements.txt"
            "static/index.html"
            "nginx/tempmail-local.conf"
          )
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ $f MISSING"
              exit 1
            fi
          done